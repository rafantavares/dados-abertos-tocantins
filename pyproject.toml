[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dados-abertos-tocantins"
version = "0.1.0"
description = "Pipeline de dados abertos de educação e gastos públicos do Tocantins"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Rafael Nunes Tavares" }]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "cryptography>=43",
    "duckdb>=1.1",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "pyshp>=2.3",
    "shapely>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "dbt-duckdb>=1.9",
]
painel = [
    "streamlit>=1.38",
    "plotly>=5.24",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["transform/target", "transform/dbt_packages"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Sinais tipográficos usados de propósito nos textos em português da interface.
allowed-confusables = ["–", "×", "º"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
