name: Validar fontes

# Baixa cada fonte candidata a partir dos runners do GitHub (que alcançam os
# sites do governo), salva relatório + amostras como artefato e publica as
# amostras pequenas numa branch "amostras-*" (nunca na main).
# Com a entrada "fontes" (prefixos de id separados por vírgula) valida só parte
# das fontes e publica em "amostras-validacao-<branch>".
on:
  workflow_dispatch:
    inputs:
      fontes:
        description: "Prefixos dos ids das fontes (ex.: siope,siconfi_rreo); vazio = todas"
        type: string
        default: ""
  push:
    branches: ["feat/1-**"]
    paths: ["scripts/validar_fontes.py", ".github/workflows/validar-fontes.yml"]

permissions:
  contents: write

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pandas openpyxl xlrd cryptography
      - run: python scripts/validar_fontes.py saida "${{ inputs.fontes }}"
      - uses: actions/upload-artifact@v6
        with:
          name: validacao-fontes
          path: saida/
          retention-days: 30
      - name: Publicar amostras
        run: |
          ramo=amostras-descoberta
          if [ -n "${{ inputs.fontes }}" ]; then ramo="amostras-validacao-${GITHUB_REF_NAME//\//-}"; fi
          cd saida
          git init -q -b "$ramo"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          find . -type f -size +5M -delete
          git add -A
          git commit -q -m "chore: amostras da validação de fontes (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$ramo"
