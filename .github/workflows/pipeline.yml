name: Pipeline de dados

# Roda os extratores reais e o dbt nos runners do GitHub (que alcançam os
# sites do governo) e publica o banco DuckDB na branch "dados" (nunca na main).
# - schedule / workflow_dispatch na main: extrai, transforma e publica.
# - push em branches feat/**: extrai e transforma para validar, sem publicar.
# Antes de publicar, a contagem de linhas é comparada com a carga anterior
# (pipeline.monitoramento); se variar fora do esperado o job falha, nada é
# publicado e uma issue com o rótulo "alerta-carga" é aberta ou atualizada.
on:
  workflow_dispatch:
    inputs:
      forcar:
        description: "Ignorar o banco anterior e recarregar tudo"
        type: boolean
        default: false
      ignorar_anomalias:
        description: "Publicar mesmo com anomalias de contagem (após conferir o motivo)"
        type: boolean
        default: false
  schedule:
    - cron: "17 9 * * 1" # segundas, 06:17 em Brasília
  push:
    branches: ["feat/**"]
    paths:
      - "src/pipeline/**"
      - "transform/**"
      - ".github/workflows/pipeline.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

env:
  DUCKDB_PATH: ${{ github.workspace }}/data/tocantins.duckdb
  PIPELINE_CACHE: ${{ github.workspace }}/data/cache

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: pip install -e ".[dev]"

      - name: Restaurar carga anterior (banco incremental, contagens e histórico)
        run: |
          mkdir -p data
          if git fetch --depth 1 origin dados 2>/dev/null; then
            git show FETCH_HEAD:contagens.json > data/contagens_anteriores.json 2>/dev/null || rm -f data/contagens_anteriores.json
            git show FETCH_HEAD:historico_contagens.jsonl > data/historico_contagens.jsonl 2>/dev/null || rm -f data/historico_contagens.jsonl
            if [ "${{ inputs.forcar }}" != "true" ]; then
              git show FETCH_HEAD:tocantins.duckdb > data/tocantins.duckdb && echo "banco anterior restaurado"
            else
              echo "forcar=true: carga completa a partir do zero"
            fi
          else
            echo "branch dados ainda não existe; carga completa"
          fi

      - name: Extrair fontes
        run: python -m pipeline.extrair

      - name: dbt build
        run: dbt build --project-dir transform

      - name: dbt docs (HTML estático)
        run: dbt docs generate --project-dir transform --static

      - name: Resumo da carga
        run: python scripts/resumo_banco.py data/tocantins.duckdb data/contagens.json

      - name: Verificar anomalias de carga
        run: |
          python -m pipeline.monitoramento data/contagens.json \
            --anterior data/contagens_anteriores.json \
            --banco data/tocantins.duckdb \
            --historico data/historico_contagens.jsonl \
            --resumo "$GITHUB_STEP_SUMMARY" \
          || { echo "::error::contagem de linhas fora do esperado (ver resumo do job)"; \
               [ "${{ inputs.ignorar_anomalias }}" = "true" ] && echo "::warning::ignorado por ignorar_anomalias=true"; }

      - name: Exportar amostras para fixtures (branches de desenvolvimento)
        if: github.ref != 'refs/heads/main'
        run: |
          python scripts/exportar_amostras.py data/tocantins.duckdb amostras
          cd amostras
          ramo="amostras-${GITHUB_REF_NAME//\//-}"
          git init -q -b "$ramo"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "chore: amostras da camada bruta (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$ramo"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: banco-duckdb
          path: |
            data/tocantins.duckdb
            data/contagens.json
            data/historico_contagens.jsonl
            transform/target/static_index.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Publicar na branch dados
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir publicar && cd publicar
          cp ../data/tocantins.duckdb ../data/contagens.json ../data/historico_contagens.jsonl .
          cp ../transform/target/static_index.html documentacao_dbt.html
          cat > README.md <<'MD'
          # Branch de dados

          Gerada automaticamente pelo workflow **Pipeline de dados**. Não edite à mão.

          - `tocantins.duckdb`: banco com as camadas `raw`, `staging`, `intermediate` e `marts`.
          - `contagens.json`: linhas por tabela nesta carga.
          - `historico_contagens.jsonl`: uma linha por carga publicada (contagens, erros e avisos).
          - `documentacao_dbt.html`: documentação do modelo (`dbt docs`), um único HTML para abrir localmente.

          URL para o painel: `https://raw.githubusercontent.com/${{ github.repository }}/dados/tocantins.duckdb`
          MD
          sed -i 's/^          //' README.md
          git init -q -b dados
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "dados: carga de $(date -u +%Y-%m-%dT%H:%MZ) (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" dados

      - name: Abrir ou atualizar issue de alerta
        if: failure() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          execucao="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          corpo="A execução $execucao do **Pipeline de dados** falhou (${{ github.event_name }}). Nada foi publicado na branch \`dados\`; o painel continua com a carga anterior. Veja o resumo do job para as tabelas afetadas."
          gh label create alerta-carga --color B60205 --description "Falha ou anomalia na carga de dados" --force
          aberta=$(gh issue list --label alerta-carga --state open --json number --jq '.[0].number')
          if [ -n "$aberta" ]; then
            gh issue comment "$aberta" --body "$corpo"
          else
            gh issue create --title "Alerta: falha na carga de dados" --label alerta-carga --body "$corpo"
          fi
